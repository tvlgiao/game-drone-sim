<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Render Preview — Drone Sim</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfe3ff; }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud { position: fixed; left: 12px; top: 12px; padding: 8px 10px; background: rgba(5, 8, 16, 0.6); border: 1px solid rgba(120, 180, 255, 0.25); border-radius: 8px; pointer-events: auto; }
      #hud button { font: inherit; color: #e8f2ff; background: rgba(40, 70, 120, 0.5); border: 1px solid rgba(120, 180, 255, 0.35); border-radius: 5px; padding: 3px 7px; margin: 2px 2px 0 0; cursor: pointer; }
      #hud button:hover { background: rgba(60, 110, 180, 0.6); }
      #stats { white-space: pre; margin-bottom: 6px; }
    </style>
  </head>
  <body>
    <canvas id="c" tabindex="0" aria-label="Render preview"></canvas>
    <div id="hud">
      <div id="stats">…</div>
      <div>
        <button data-cam="fpv">1 FPV</button><button data-cam="chase">2 Chase</button><button data-cam="los">3 LOS</button>
      </div>
      <div>
        <button data-tier="ultra">Ultra</button><button data-tier="high">High</button><button data-tier="medium">Medium</button><button data-tier="low">Low</button>
      </div>
      <div>
        <button data-act="crash">X Crash</button><button data-act="bump">H Bump</button><button data-act="respawn">R Respawn</button><button data-act="free">F Free-fly</button><button data-act="pause">P Pause</button>
      </div>
    </div>
    <script type="module" src="/src/render/preview.ts"></script>
  </body>
</html>
